<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>د سند تاییدول | Rokhan Academic Center</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#C0392B;--red-light:#E74C3C;--dark:#1A0A08;--dark2:#2C1210;--dark3:#3D1A17;--text:#F5EDE8;--text-muted:#B39690;--green:#27AE60;--green-light:#2ECC71;--border:rgba(192,57,43,0.25);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--dark);color:var(--text);font-family:'Tajawal',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(ellipse at 15% 15%,rgba(192,57,43,0.12) 0%,transparent 55%),radial-gradient(ellipse at 85% 85%,rgba(192,57,43,0.07) 0%,transparent 55%);pointer-events:none;z-index:0;}
.container{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:40px 20px 100px;}
.header{text-align:center;margin-bottom:44px;animation:fadeDown .8s ease both;}
.logo-wrap{width:110px;height:110px;margin:0 auto 18px;border-radius:50%;border:3px solid var(--red);box-shadow:0 0 40px rgba(192,57,43,0.45);overflow:hidden;}
.logo-img{width:100%;height:100%;object-fit:cover;display:block;}
.org-pashto{font-family:'Amiri',serif;font-size:26px;font-weight:700;color:#F0C8C0;margin-bottom:4px;}
.org-english{font-size:13px;color:var(--red-light);font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;}
.divider{display:flex;align-items:center;gap:14px;margin:16px auto;max-width:360px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent);}
.divider-diamond{width:7px;height:7px;background:var(--red);transform:rotate(45deg);flex-shrink:0;}
.page-title{font-size:16px;color:var(--text-muted);}
.search-section{animation:fadeUp .7s .2s ease both;}
.search-card{background:var(--dark2);border:1px solid var(--border);border-radius:20px;padding:36px 40px;box-shadow:0 20px 60px rgba(0,0,0,0.5);position:relative;overflow:hidden;}
.search-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--red),var(--red-light),var(--red),transparent);}
.search-label{font-size:17px;font-weight:600;color:var(--text);margin-bottom:6px;display:block;}
.search-hint{font-size:13px;color:var(--text-muted);margin-bottom:22px;}
.input-row{display:flex;gap:12px;flex-wrap:wrap;}
.cert-input{flex:1;min-width:200px;background:var(--dark3);border:1.5px solid rgba(192,57,43,0.35);border-radius:12px;padding:15px 18px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:16px;outline:none;transition:all .3s;text-align:right;direction:ltr;}
.cert-input::placeholder{color:var(--text-muted);direction:rtl;}
.cert-input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,0.15);}
.search-btn{background:linear-gradient(135deg,var(--red),var(--red-light));color:#fff;border:none;border-radius:12px;padding:15px 30px;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.search-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(192,57,43,0.45);}
.search-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none;}
@keyframes spin{to{transform:rotate(360deg)}}
.result-wrapper{margin-top:28px;animation:fadeUp .5s ease both;}
.result-card{background:var(--dark2);border:1px solid rgba(39,174,96,0.3);border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.result-top{background:linear-gradient(135deg,rgba(39,174,96,0.15),rgba(39,174,96,0.05));border-bottom:1px solid rgba(39,174,96,0.2);padding:22px 28px;display:flex;align-items:center;gap:18px;}
.big-check{width:58px;height:58px;background:linear-gradient(135deg,#27AE60,#2ECC71);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;font-weight:900;flex-shrink:0;box-shadow:0 0 24px rgba(39,174,96,0.5);}
.verified-info{display:flex;flex-direction:column;gap:8px;}
.verified-title{font-size:15px;font-weight:700;color:var(--green-light);}
.cert-badge{display:inline-flex;align-items:center;border-radius:20px;overflow:hidden;border:1px solid rgba(200,146,42,0.5);}
.cert-label{background:rgba(200,146,42,0.25);color:#E8B84B;font-size:11px;font-weight:800;padding:5px 12px;letter-spacing:.5px;}
.cert-value{background:rgba(200,146,42,0.08);color:#F5E6C8;font-size:13px;font-weight:700;padding:5px 14px;font-family:monospace;letter-spacing:1px;}
.result-body{padding:28px 30px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start;}
@media(max-width:560px){.result-body{grid-template-columns:1fr}}
.no-photo{width:115px;height:135px;background:var(--dark3);border:2px dashed rgba(192,57,43,0.35);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:38px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:480px){.info-grid{grid-template-columns:1fr}}
.info-item{background:var(--dark3);border:1px solid rgba(255,255,255,0.05);border-radius:12px;padding:13px 16px;}
.info-item.full{grid-column:1/-1;}
.info-item.name-box{background:linear-gradient(135deg,rgba(39,174,96,0.12),rgba(39,174,96,0.04));border:1px solid rgba(39,174,96,0.3);}
.info-key{font-size:10px;color:var(--red-light);font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:4px;}
.name-box .info-key{color:var(--green-light);}
.info-val{font-size:15px;color:var(--text);font-weight:500;font-family:'Amiri',serif;}
.name-box .info-val{font-size:18px;font-weight:700;color:#fff;}
.grade-pill{display:inline-block;background:linear-gradient(135deg,var(--red),var(--red-light));color:#fff;border-radius:8px;padding:2px 14px;font-weight:800;font-size:17px;font-family:'Tajawal',sans-serif;}
.result-footer{border-top:1px solid var(--border);padding:14px 28px;font-size:12px;color:var(--text-muted);}
.error-card{background:rgba(192,57,43,0.08);border:1px solid rgba(192,57,43,0.3);border-radius:16px;padding:28px 30px;text-align:center;margin-top:28px;animation:fadeUp .5s ease both;}
.error-icon{font-size:40px;margin-bottom:12px;}
.error-title{font-size:18px;font-weight:700;color:var(--red-light);margin-bottom:8px;}
.error-msg{font-size:14px;color:var(--text-muted);line-height:1.8;}
.footer-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:linear-gradient(90deg,#7B1A12,var(--red),#7B1A12);border-top:1px solid rgba(255,255,255,0.1);padding:10px 24px;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;}
.footer-bar a{color:rgba(255,255,255,0.9);font-size:13px;text-decoration:none;display:flex;align-items:center;gap:6px;}
.footer-bar a:hover{color:#fff;}
.footer-div{width:1px;height:18px;background:rgba(255,255,255,0.3);}
.watermark{position:fixed;bottom:52px;left:14px;font-size:10px;color:rgba(255,255,255,0.15);font-family:'Tajawal',sans-serif;line-height:1.6;z-index:99;}
@keyframes fadeDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

function norm(s) {

}

document.getElementById("certInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") searchCert();
});

function searchCert() {
  var q = document.getElementById("certInput").value.trim();
  if (!q) {
    alert("مهرباني وکړئ د سرټیفیکیټ نمبر ولیکئ");
    return;
  }
  var btn = document.getElementById("searchBtn");
  var sp  = document.getElementById("spinner");
  var bt  = document.getElementById("btnText");
  btn.disabled = true;
  sp.style.display = "block";
  bt.textContent = "...";
  setTimeout(function() {
    var res = null;
    for (var i = 0; i < STUDENTS.length; i++) {
      if (norm(STUDENTS[i]["Certificate NO"]) === norm(q)) {
        res = STUDENTS[i];
        break;
      }
    }
    if (res) showResult(res);
    else showError(q);
    btn.disabled = false;
    sp.style.display = "none";
    bt.textContent = "لټول";
  }, 300);
